map $args $bnbu_performance_valid {
    default 0;
    "~^v=1&id=[0-9a-f]{16}&dns=[0-9]{1,6}&connect=[0-9]{1,6}&tls=[0-9]{1,6}&wait=[0-9]{1,6}&download=[0-9]{1,6}&ttfb=[0-9]{1,6}&fcp=[0-9]{1,6}&ready=[0-9]{1,6}&load=[0-9]{1,6}&count=[0-9]{1,6}&bytes=[0-9]{1,9}&protocol=(h2|h3|http%2F1\.1|other)&restored=[01]$" 1;
}
log_format bnbu_performance escape=json '{"time":"$time_iso8601","host":"$host","id":"$arg_id","dns":"$arg_dns","connect":"$arg_connect","tls":"$arg_tls","wait":"$arg_wait","download":"$arg_download","ttfb":"$arg_ttfb","fcp":"$arg_fcp","ready":"$arg_ready","load":"$arg_load","count":"$arg_count","bytes":"$arg_bytes","protocol":"$arg_protocol","restored":"$arg_restored"}';
limit_req_zone $binary_remote_addr zone=bnbu_performance:1m rate=10r/s;
