            type: object
            additionalProperties: false
            required:
              - rosterEntryId
              - studentNumber
              - fullName
              - status
              - studentId
              - enrollmentId
              - progress
              - physical
              - pendingCount
              - finalGrade
            properties:
              rosterEntryId:
                type:
                  - string
                  - "null"
                format: uuid
              studentNumber:
                type: string
              fullName:
                type: string
              status:
                type: string
                enum:
                  - MATCHED
                  - PENDING_REGISTRATION
                  - IDENTITY_CONFLICT
                  - EXTRA_IN_PLATFORM
                x-transport-constraint: true
              studentId:
                type:
                  - string
                  - "null"
                format: uuid
              enrollmentId:
                type:
                  - string
                  - "null"
                format: uuid
              finalGrade:
                type:
                  - object
                  - "null"
                additionalProperties: false
                description: Teacher-only internal results, independent of exercise progress. Latest editing
                  revision and latest published revision may differ; a later draft does not replace
                  the published result.
                required:
                  - latestRevision
                  - publishedRevision
                properties:
                  latestRevision: &a1
                    type:
                      - object
                      - "null"
                    additionalProperties: false
                    required:
                      - version
                      - finalGrade
                      - published
                      - createdAt
                    properties:
                      version:
                        type: integer
                        minimum: 1
                      finalGrade:
                        type: integer
                        minimum: -2147483648
                        maximum: 2147483647
                      published:
                        type: boolean
                      createdAt:
                        type: string
                        format: date-time
                  publishedRevision: *a1
              pendingCount:
                type:
                  - integer
                  - "null"
                minimum: 0
              progress:
                type:
                  - object
                  - "null"
                additionalProperties: false
                required:
                  - actualSeconds
                  - invalidActualSeconds
                  - validUncreditedSeconds
                  - creditedSeconds
                  - pendingActualSeconds
                  - course
                  - general
                  - remainingSeconds
                  - targetReached
                properties:
                  actualSeconds:
                    type: integer
                    minimum: 0
                  invalidActualSeconds:
                    type: integer
                    minimum: 0
                  validUncreditedSeconds:
                    type: integer
                    minimum: 0
                  creditedSeconds:
                    type: integer
                    minimum: 0
                  pendingActualSeconds:
                    type: integer
                    minimum: 0
                  remainingSeconds:
                    type: integer
                    minimum: 0
                  course: &a2
                    type: object
                    additionalProperties: false
                    required:
                      - targetSeconds
                      - validExerciseSeconds
                      - recognizedSeconds
                      - effectiveSeconds
                      - remainingSeconds
                    properties:
                      targetSeconds:
                        type: integer
                        minimum: 0
                      validExerciseSeconds:
                        type: integer
                        minimum: 0
                      recognizedSeconds:
                        type: integer
                        minimum: 0
                      effectiveSeconds:
                        type: integer
                        minimum: 0
                      remainingSeconds:
                        type: integer
                        minimum: 0
                  general: *a2
                  targetReached:
                    type: boolean
              physical:
                type:
                  - object
                  - "null"
                additionalProperties: false
                required:
                  - status
                  - result
                properties:
                  status:
                    type: string
                    enum:
                      - EXEMPT
                      - RECORDED
                      - NOT_RECORDED
                    x-transport-constraint: true
                  result:
                    type:
                      - object
                      - "null"
                    additionalProperties: false
                    required:
                      - version
                      - runType
                      - elapsedSeconds
                      - testedOn
                    properties:
                      version:
                        type: integer
                        minimum: 1
                      runType:
                        type: string
                        enum:
                          - 1000m
                          - 800m
                        x-transport-constraint: true
                      elapsedSeconds:
                        type: integer
                        minimum: 0
                      testedOn:
                        type: string
                        format: date
        extras:
          type: array
          items: *a3
