          minLength: 1
          maxLength: 128
        fullName:
          type: string
          minLength: 1
          maxLength: 128
        gender:
          type:
            - string
            - "null"
          maxLength: 128
        gradeYear:
          type:
            - string
            - "null"
          maxLength: 128
        collegeName:
          type:
            - string
            - "null"
          maxLength: 128
        majorName:
          type:
            - string
            - "null"
          maxLength: 128
        administrativeClassName:
          type:
            - string
            - "null"
          maxLength: 128
      description: Canonical field to exact UTF-8 CSV header mapping. Values must be distinct after trim
        and contain no control characters.
    CreateRosterImportRequest:
      type: object
      additionalProperties: false
      required:
        - source
        - fileFormat
        - file
        - fieldMappingSnapshot
      properties:
        source:
          $ref: "#/components/schemas/RosterImportSource"
        fileFormat:
          $ref: "#/components/schemas/RosterFileFormat"
        file:
          type: string
          format: binary
          description: Original UTF-8 CSV, XLS or XLSX file; stored privately without converting the source.
        fileChecksumSha256:
          oneOf:
            - $ref: "#/components/schemas/Sha256"
            - type: "null"
        fieldMappingSnapshot:
          $ref: "#/components/schemas/RosterFieldMapping"
        sheetName:
          type: string
          minLength: 1
          maxLength: 31
          description: Required for XLS or XLSX; exact source worksheet name. Omit for CSV.
      description: FILE accepts CSV, XLS or XLSX. XLS/XLSX requires sheetName; CSV omits it. OFFICIAL_API remains
        unsupported.
      allOf:
        - if:
            properties:
              fileFormat:
                enum: [XLS, XLSX]
          then:
            required:
              - sheetName
          else:
            not:
              required:
                - sheetName
