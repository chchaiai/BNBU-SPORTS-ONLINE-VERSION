      properties:
        mediaIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/OpaqueId"
          description: Complete set of AVAILABLE EXERCISE_RECORD media captured in-app for this session.
            Omitting any eligible item is rejected.
        expectedVersion:
          $ref: "#/components/schemas/PositiveVersion"
        swimDelayReason:
          type: string
          minLength: 1
          maxLength: 1000
    InitiateMediaUploadRequest:
      type: object
      additionalProperties: false
      required:
        - businessPurpose
        - mediaType
        - mimeType
        - fileSizeBytes
        - captureSource
      properties:
        sessionId:
          $ref: "#/components/schemas/OpaqueId"
        enrollmentId:
          $ref: "#/components/schemas/OpaqueId"
        businessPurpose:
          $ref: "#/components/schemas/MediaBusinessPurpose"
        mediaType:
          $ref: "#/components/schemas/MediaType"
        mimeType:
          type: string
          minLength: 1
          maxLength: 127
          enum:
            - image/jpeg
            - image/png
            - video/mp4
            - video/quicktime
            - video/3gpp
            - video/webm
            - image/webp
            - application/pdf
          x-transport-constraint: true
          description: Untrusted transport declaration. The server verifies the actual bytes and container;
            clients must not substitute video/mp4 when the browser reports an empty or different
            MIME.
        fileSizeBytes:
          type: integer
          minimum: 1
          description: Exact upload length used for transport integrity. New EXERCISE_RECORD VIDEO uploads are limited to 200 MiB.
        captureSource:
          $ref: "#/components/schemas/CaptureSource"
          x-runtime-enum:
            - IN_APP_CAMERA
            - FILE_PICKER
          description: EXERCISE_RECORD requires IN_APP_CAMERA. EXEMPTION_APPLICATION permits IN_APP_CAMERA or
            FILE_PICKER; SYSTEM_IMPORT is not accepted by this student endpoint.
        declaredContentSha256:
          oneOf:
            - $ref: "#/components/schemas/Sha256"
            - type: "null"
          description: Optional and untrusted client declaration; it is not an integrity fact.
        durationSeconds:
          type:
            - integer
            - "null"
          minimum: 1
          description: Optional for VIDEO when duration cannot be read without decoding; omit or null for IMAGE. New EXERCISE_RECORD VIDEO is limited to 10 seconds and is authoritatively validated after server normalization.
      oneOf:
        - properties:
            businessPurpose:
              const: EXERCISE_RECORD
            sessionId:
              $ref: "#/components/schemas/OpaqueId"
          required:
            - sessionId
          not:
            properties:
              enrollmentId: {}
            required:
              - enrollmentId
        - properties:
            businessPurpose:
              const: EXEMPTION_APPLICATION
            enrollmentId:
              $ref: "#/components/schemas/OpaqueId"
          required:
            - enrollmentId
          not:
            properties:
              sessionId: {}
            required:
              - sessionId
      allOf:
        - if:
            properties:
              businessPurpose:
                const: EXERCISE_RECORD
              mediaType:
                const: VIDEO
            required:
              - businessPurpose
              - mediaType
          then:
            properties:
              durationSeconds:
                type: integer
                minimum: 1
                maximum: 10
            required:
              - durationSeconds
      description: EXERCISE_RECORD media is scoped to an owned ExerciseSession. EXEMPTION_APPLICATION
        media is scoped to an owned active Enrollment before atomic association with an application
        draft. No location permission or GPS data is required; uploaded JPEG/PNG/ISO/WebM media
        containing recognized location metadata is rejected.
