        - Authentication
        - Client Capabilities
      operationId: verifyStudentSignInCode
      x-access-policy:
        policyId: AUTH-STUDENT-CODE-VERIFY
        authentication: PUBLIC
        allowedRoles: []
        organizationScope: NONE
        resourceScope: NONE
        resourceResolver: NONE
        defaultDeny: true
      summary: Verify a student sign-in challenge or verify school email for course joining
      security: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentSignInCodeVerificationRequest"
      description: With joinInviteToken and joinEmail, verify the school email and return an invite-scoped joinEmailProof and the verified owner profile without creating a user, session, or enrollment. Pass this proof to join-capabilities after confirming student details; the final join atomically creates the verified account and enrollment. An authenticated student with an already verified school email may omit the proof at the member capability endpoint. Otherwise verify the one-time code for normal sign-in first. A valid code without a currently eligible verified student account consumes the challenge and returns USER_NOT_FOUND (404), with details.resourceType STUDENT_SIGN_IN_ACCOUNT. Incorrect, expired, locked, or consumed codes return AUTH_VERIFICATION_CODE_INVALID (401). The request endpoint retains a uniform accepted response.
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "200":
          description: Authenticated session for sign-in, or verified email proof when joinInviteToken and joinEmail are supplied.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthEnvelope"
                  - type: object
                    required: [data, meta]
                    properties:
                      meta:
                        type: object
                      data:
                        type: object
                        required: [joinEmailProof, expiresAt, profile]
                        properties:
                          joinEmailProof:
                            type: string
                          expiresAt:
                            type: string
                            format: date-time
                          profile:
                            type: [object, 'null']
                            description: Only the verified email owner's student profile, or null for first registration.
