    ClientErrorReportRequest:
      type: object
      additionalProperties: false
      required:
        - platform
        - level
        - errorCode
        - category
        - retryable
        - clientOccurredAt
      properties:
        platform:
          type: string
          enum:
            - WEB_STUDENT
            - WEB_TEACHER
            - WEB_ADMIN
          x-transport-constraint: true
        level:
          type: string
          enum:
            - ERROR
          x-transport-constraint: true
        errorCode:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          maxLength: 100
        category:
          type: string
          enum:
            - NETWORK
            - TIMEOUT
            - AUTHENTICATION
            - AUTHORIZATION
            - CONFLICT
            - VALIDATION
            - RATE_LIMIT
            - SERVER
            - UNKNOWN
          x-transport-constraint: true
        httpStatus:
          type: integer
          minimum: 100
          maximum: 599
        method:
          type: string
          enum:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
          x-transport-constraint: true
        route:
          type: string
          pattern: ^/[A-Za-z0-9._~!$&()*+,;=:@%/-]*$
          maxLength: 300
        retryable:
          type: boolean
        relatedRequestId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_.:-]{1,128}$
        clientOccurredAt:
          type: string
          format: date-time
      description: Closed, redacted client telemetry metadata. Arbitrary text, stack traces, request
        bodies, URLs with query strings, and attachments are intentionally unsupported.
