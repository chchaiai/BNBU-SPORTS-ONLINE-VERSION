name: bnbu-demand-20260916
services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: server /data
    environment:
      MINIO_ROOT_USER: demand-local-test
      MINIO_ROOT_PASSWORD: demand-local-test-secret-only
    ports: ["127.0.0.1:59000:9000"]
    tmpfs: [/data]
  mailpit:
    image: axllent/mailpit:v1.30.0
    ports: ["127.0.0.1:58025:8025", "127.0.0.1:51025:1025"]
  postgres-browser:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: bnbu_sports_test
      POSTGRES_USER: bnbu_test
      POSTGRES_PASSWORD: demand-local-test-only
    ports: ["127.0.0.1:55433:5432"]
    tmpfs: [/var/lib/postgresql]
  postgres:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: bnbu_sports_test
      POSTGRES_USER: bnbu_test
      POSTGRES_PASSWORD: demand-local-test-only
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U bnbu_test -d bnbu_sports_test]
      interval: 2s
      timeout: 3s
      retries: 30
