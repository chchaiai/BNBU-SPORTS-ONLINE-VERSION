# Infrastructure ingress. Deploy Web/Backend before replacing the 503 location.
server {
    listen 80;
    listen [::]:80;
    server_name www.student.bnbusports.cn www.teacher.bnbusports.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.student.bnbusports.cn www.teacher.bnbusports.cn;
    ssl_certificate /etc/letsencrypt/live/bnbu-staging-hk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bnbu-staging-hk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BNBUStagingTLS:1m;
    ssl_session_timeout 1d;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    location = /__infra/health {
        default_type application/json;
        return 200 '{"scope":"https-ingress","status":"READY","backend":"DEPLOYMENT_PENDING"}\n';
    }
    location / {
        default_type application/json;
        return 503 '{"status":"BACKEND_DEPLOYMENT_PENDING"}\n';
    }
}
