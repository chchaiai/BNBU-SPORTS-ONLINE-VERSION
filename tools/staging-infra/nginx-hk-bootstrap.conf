# Infrastructure bootstrap only. Replace the 503 route when deploying the Web/Backend.
server {
    listen 80;
    listen [::]:80;
    server_name www.student.bnbusports.cn www.teacher.bnbusports.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        default_type application/json;
        return 503 '{"status":"BACKEND_DEPLOYMENT_PENDING"}\n';
    }
}
